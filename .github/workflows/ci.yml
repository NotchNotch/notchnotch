name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Toolchain
        run: |
          swift --version
          node --version
          pnpm --version

      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, build and test
        run: pnpm check

      - name: Package app
        run: node scripts/package-app.mjs
        env:
          NOTCHNOTCH_BUILD_NUMBER: ${{ github.run_number }}
