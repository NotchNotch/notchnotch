name: Publish SDK to npm

# Publishes @notchnotch/{protocol,react-renderer,runtime,sdk,cli} and
# create-notchnotch-extension at the release's version, with npm provenance.
#
# Authentication: pnpm first tries npm Trusted Publishing (OIDC). Configure it
# on npmjs.com for each package (repository sadeqi-ah/notchnotch, workflow
# npm.yml); then no secret is needed. Until then it falls back to NPM_TOKEN.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Build and test the packages
        run: |
          pnpm typecheck
          pnpm build:packages
          node --test tests/create.test.mjs
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Private workspace packages (the app, bundled extensions, examples) are skipped.
        run: pnpm -r publish --access public --no-git-checks
