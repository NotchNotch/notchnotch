name: Release

# Push a tag that matches package.json, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
# Creates a draft GitHub release with a signed and notarized DMG.
#
# Required repository secrets:
#   DEVELOPER_ID_P12             base64 of the "Developer ID Application" certificate + key (.p12)
#   DEVELOPER_ID_P12_PASSWORD    password of that .p12
#   DEVELOPER_ID_IDENTITY        e.g. "Developer ID Application: Your Name (TEAMID)"
#   NOTARY_KEY_P8                base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID                key id
#   NOTARY_ISSUER_ID             issuer id

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match package.json $version"; exit 1; }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Import signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          test -n "$P12" || { echo "DEVELOPER_ID_P12 secret is missing"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Store notarization credentials
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials notchnotch-notary \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --keychain "$RUNNER_TEMP/signing.keychain-db"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Build, sign and notarize
        env:
          NOTCHNOTCH_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          NOTCHNOTCH_NOTARY_PROFILE: notchnotch-notary
          NOTCHNOTCH_BUILD_NUMBER: ${{ github.run_number }}
        run: pnpm release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          notes=$(awk -v v="$version" '$0 ~ "^## \\[?"v {found=1; next} found && /^## / {exit} found' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "dist/NotchNotch-$version.dmg" \
            --draft --title "NotchNotch $version" --notes "${notes:-See CHANGELOG.md}"

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
